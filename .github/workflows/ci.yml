name: Validate checkout

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  LITELLM_LOCAL_MODEL_COST_MAP: "True"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install uv==0.12.21
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run --frozen pytest -m 'not integration' -q
        working-directory: backend
      - run: uv run --frozen --project backend python scripts/export_openapi.py
      - run: npm ci
        working-directory: frontend
      - run: npm run codegen
        working-directory: frontend
      - run: git diff --exit-code -- frontend/types/openapi.json frontend/types/api.ts
      - run: npm run test && npm run typecheck && npm run lint && npm run build
        working-directory: frontend

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: analyst
          POSTGRES_PASSWORD: analyst
          POSTGRES_DB: analyst_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U analyst -d analyst_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://analyst:analyst@localhost:5432/analyst_test
      TEST_DATABASE_URL: postgresql+asyncpg://analyst:analyst@localhost:5432/analyst_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.12.21
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run --frozen alembic upgrade head
        working-directory: backend
      - run: uv run --frozen pytest -m integration -q
        working-directory: backend
