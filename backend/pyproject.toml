[project]
name = "alpha-analyst-backend"
version = "0.1.0"
description = "AlphaAnalyst backend service"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "litellm",
    "httpx",
    "tenacity",
    "sqlalchemy[asyncio]>=2",
    "asyncpg",
    "alembic",
    "pgvector",
    "redis",
    "python-dotenv",
    "pyyaml",
    "feedparser",
    "reportlab",
    "openpyxl",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "pytest-mock", "respx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires an explicitly configured disposable PostgreSQL database"]
